name: Update flake.lock PR
description: >
  Runs `nix flake update`, and if that changes flake.lock, pushes a branch and opens (or updates) a
  pull request targeting the repository's default branch. When `diff-targets` is set, it also builds
  each target before and after the update, attaches an nvd package diff to the PR body, and — when
  `cache-s3-url` is set — pushes the resulting post-update paths to a binary cache.

  If flake.lock is already up to date and an open update PR exists from `branch-name`, that PR is
  closed instead.

  The caller does everything this action can't reach from inside a shared repo: install/configure
  Nix (registering a signing key there too, so anything built here is already signed by the time
  it's copied out), check out the repository, and generate a token if downstream CI on the resulting
  PR needs to fire (see `token` / `has-app-token`). Composite actions cannot reference sibling
  actions by relative path — a relative `uses:` resolves against the caller's workspace, not this
  repo (actions/runner#1348) — so this action nests no other action.

inputs:
  token:
    description: >
      GitHub token used for `gh pr` operations and `git push`. Pass a GitHub App token when the
      resulting PR needs to trigger downstream `pull_request` CI — PRs opened with the plain
      `GITHUB_TOKEN` never fire that event, by GitHub design. Pass `github.token` otherwise; the PR
      still gets created, just without automatic CI on it.
    required: true
  has-app-token:
    description: >
      Whether `token` is a GitHub App token rather than `GITHUB_TOKEN`. Purely informational: it only
      switches the PR body warning and the trailing notice about pull_request events not firing, so
      set it to match what `token` actually is — the action can't detect that itself.
    required: false
    default: 'false'
  branch-name:
    description: Name of the branch to push the flake.lock update to.
    required: false
    default: automation/flake-update
  auto-merge:
    description: >
      Enable GitHub auto-merge (squash) on the created PR. Requires the repository to have "Allow
      auto-merge" enabled in settings and branch protection with required status checks.
    required: false
    default: 'true'
  diff-targets:
    description: >
      Newline-separated list of flake attributes to build before and after the update for an nvd
      package diff (e.g. 'checks.x86_64-linux.tuxedo-build'). Leave empty to skip building and
      diffing entirely.
    required: false
    default: ''
  cache-s3-url:
    description: >
      S3 URL for `nix copy --to` (e.g. s3://my-bucket?region=eu-central-1). Leave empty to skip
      pushing the post-update build results anywhere — they still get built for the diff, but stay
      local to the runner and are gone once it's torn down.
    required: false
    default: ''
  aws-access-key-id:
    description: AWS access key ID for the S3 cache push.
    required: false
    default: ''
  aws-secret-access-key:
    description: AWS secret access key for the S3 cache push.
    required: false
    default: ''

outputs:
  has-changes:
    description: >
      'true' when `nix flake update` changed flake.lock, 'false' otherwise. Every build/diff/push
      step in this action runs only when this is 'true'; a caller chaining more steps after this
      action should gate on it too.
    value: ${{ steps.check.outputs.has_changes }}
  paths-file:
    description: >
      Path to a file of newline-separated Nix store paths built for the diff targets, or empty when
      there was nothing to build (no changes, no diff-targets, or every target failed to build).
      Feed this to a cache tool's own manifest/generation step to record what this run produced,
      without this action needing to know that tool exists.
    value: ${{ steps.post-paths.outputs.path-file }}
  gen:
    description: >
      A sanitized generation id (`<branch>-<short-sha>`) identifying this update run, safe to use as
      a manifest path segment. Pair with `paths-file` to name a generation in a downstream cache
      tool.
    value: ${{ steps.ids.outputs.gen }}
  branch:
    description: Sanitized form of `branch-name`, using the same sanitization as `gen`.
    value: ${{ steps.ids.outputs.branch }}

runs:
  using: composite
  steps:
    - name: Resolve chaining identifiers
      # Computed up front and unconditionally: cheap, and a caller chaining a cache tool's own
      # action wants `gen`/`branch` available under the same key it will build with, whether or not
      # this run actually changed anything.
      id: ids
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch-name }}
      run: |
        san() { printf '%s' "$1" | tr -c 'A-Za-z0-9_.-' '-'; }
        branch="$(san "$BRANCH_NAME")"
        gen="${branch}-$(git rev-parse --short HEAD)"
        {
          echo "branch=$branch"
          echo "gen=$gen"
        } >> "$GITHUB_OUTPUT"

    - name: Filter diff targets to current system
      if: ${{ inputs.diff-targets != '' }}
      shell: bash
      env:
        DIFF_TARGETS: ${{ inputs.diff-targets }}
      run: |
        current_system=$(nix eval --impure --raw --expr 'builtins.currentSystem')
        echo "Runner system: $current_system"
        : > "$RUNNER_TEMP/diff-targets.txt"
        while IFS= read -r target; do
          [[ -z "$target" ]] && continue
          sys=$(cut -d. -f2 <<< "$target")
          if [[ "$sys" == "$current_system" ]]; then
            printf '%s\n' "$target" >> "$RUNNER_TEMP/diff-targets.txt"
          else
            echo "::notice::Skipping $target — not buildable on $current_system runner"
          fi
        done <<< "$DIFF_TARGETS"
        if [[ ! -s "$RUNNER_TEMP/diff-targets.txt" ]]; then
          echo "::notice::No diff targets match the runner system; nvd diff will be skipped."
        fi

    - name: Update flake.lock
      shell: bash
      run: nix flake update

    - name: Check for changes
      id: check
      shell: bash
      run: |
        if git diff --quiet flake.lock; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Close stale PR if no changes
      if: ${{ steps.check.outputs.has_changes == 'false' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch-name }}
      run: |
        existing_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
        if [[ -n "$existing_pr" ]]; then
          gh pr close "$existing_pr" --comment "Closing: \`flake.lock\` is already up to date after the latest \`nix flake update\` run."
          echo "Closed stale PR #${existing_pr}."
        else
          echo "No changes to flake.lock and no open PR to close. Nothing to do."
        fi

    - name: Build pre-update targets
      if: ${{ steps.check.outputs.has_changes == 'true' && inputs.diff-targets != '' }}
      shell: bash
      run: |
        # Save the updated flake.lock and restore the old one so nix build evaluates the old inputs.
        cp flake.lock "$RUNNER_TEMP/new-flake.lock"
        git checkout -- flake.lock

        # Appended straight to the file the diff step reads, rather than collected in an
        # associative array: the macOS runners' /bin/bash is 3.2 and has no `declare -A`.
        : > "$RUNNER_TEMP/pre-update-paths.txt"
        : > "$RUNNER_TEMP/build-failures.txt"
        while IFS= read -r target; do
          [[ -z "$target" ]] && continue
          echo "::group::Building pre-update: $target"
          # --keep-going and tolerate failure so one broken target does not
          # abort the loop; other targets still get built and diffed.
          if nix build --keep-going ".#${target}" --no-link; then
            path=$(nix path-info ".#${target}")
            printf '%s=%s\n' "$target" "$path" >> "$RUNNER_TEMP/pre-update-paths.txt"
            echo "Pre-update store path: $path"
          else
            echo "::warning::Pre-update build failed for ${target}; skipping its diff."
            printf -- '- `%s` — pre-update build failed\n' "$target" >> "$RUNNER_TEMP/build-failures.txt"
          fi
          echo "::endgroup::"
        done < "$RUNNER_TEMP/diff-targets.txt"

        # Restore the updated flake.lock for subsequent steps.
        cp "$RUNNER_TEMP/new-flake.lock" flake.lock

    - name: Generate nvd diff
      if: ${{ steps.check.outputs.has_changes == 'true' && inputs.diff-targets != '' }}
      shell: bash
      run: |
        pre_paths_file="$RUNNER_TEMP/pre-update-paths.txt"
        diff_output=""

        # Store paths never contain '=', so the first field is the target and the rest is
        # the path. A function rather than an associative array, for bash 3.2 on macOS.
        pre_update_path() {
          [[ -f "$pre_paths_file" ]] || return 0
          while IFS='=' read -r t p; do
            if [[ "$t" == "$1" ]]; then
              printf '%s' "$p"
              return 0
            fi
          done < "$pre_paths_file"
        }

        while IFS= read -r target; do
          [[ -z "$target" ]] && continue

          old_path=$(pre_update_path "$target")
          if [[ -z "$old_path" ]]; then
            echo "Skipping $target — pre-update build was not available"
            continue
          fi

          echo "::group::Building post-update: $target"
          # --keep-going and tolerate failure so a single broken target does
          # not abort the loop. Whatever built still gets pushed below.
          if ! nix build --keep-going ".#${target}" --no-link; then
            echo "::endgroup::"
            echo "::warning::Post-update build failed for ${target}; skipping its diff."
            printf -- '- `%s` — post-update build failed\n' "$target" >> "$RUNNER_TEMP/build-failures.txt"
            continue
          fi
          echo "::endgroup::"

          new_path=$(nix path-info ".#${target}")

          if [[ "$old_path" == "$new_path" ]]; then
            diff_output+=$'\n\n<details>\n<summary><code>'"$target"$'</code> — no change</summary>\n\nStore path unchanged: `'"$new_path"$'`\n</details>'
            continue
          fi

          echo "::group::nvd diff: $target"
          nvd_result=$(nix run 'nixpkgs#nvd' -- --color never diff "$old_path" "$new_path" 2>&1) || true
          echo "$nvd_result"
          echo "::endgroup::"

          diff_output+=$'\n\n<details open>\n<summary><code>'"$target"$'</code></summary>\n\n```\n'"$nvd_result"$'\n```\n</details>'
        done < "$RUNNER_TEMP/diff-targets.txt"

        max_len=50000
        if [[ ${#diff_output} -gt $max_len ]]; then
          diff_output="${diff_output:0:$max_len}

        ... (truncated — diff output exceeded ${max_len} characters)"
        fi

        if [[ -n "$diff_output" ]]; then
          printf '%s\n' "$diff_output" > "$RUNNER_TEMP/nvd-diff.md"
        fi

    - name: Collect post-update store paths
      id: post-paths
      # always(): collect even when a build step failed, so successfully built
      # paths still get pushed and are not rebuilt on the next run.
      if: ${{ always() && steps.check.outputs.has_changes == 'true' && inputs.diff-targets != '' }}
      shell: bash
      run: |
        : > "$RUNNER_TEMP/post-update-paths.txt"
        while IFS= read -r target; do
          [[ -z "$target" ]] && continue
          # Resolve the whole derivation closure (including outputs) and keep
          # only paths that exist in the store, so partially built targets
          # still contribute their finished dependencies.
          drv=$(nix path-info --derivation ".#${target}" 2>/dev/null || true)
          [[ -z "$drv" ]] && continue
          # Build-closure outputs minus the .drv files themselves (we publish
          # built outputs, not derivations).
          nix-store --query --requisites --include-outputs "$drv" 2>/dev/null \
            | { grep -v '\.drv$' || true; } | sort -u > "$RUNNER_TEMP/candidates.txt"
          # Keep only paths valid in the store. --print-invalid lists the
          # missing ones in a single call, so a partial build still
          # contributes its finished outputs without spawning a process per
          # path.
          xargs -r nix-store --check-validity --print-invalid \
            < "$RUNNER_TEMP/candidates.txt" 2>/dev/null \
            | sort -u > "$RUNNER_TEMP/invalid.txt"
          comm -23 "$RUNNER_TEMP/candidates.txt" "$RUNNER_TEMP/invalid.txt" \
            >> "$RUNNER_TEMP/post-update-paths.txt"
        done < "$RUNNER_TEMP/diff-targets.txt"
        sort -u "$RUNNER_TEMP/post-update-paths.txt" -o "$RUNNER_TEMP/post-update-paths.txt"
        if [[ -s "$RUNNER_TEMP/post-update-paths.txt" ]]; then
          # A file (not inline) so large closures don't overflow the step env,
          # matching the store-paths-file a cache-push step expects.
          echo "path-file=$RUNNER_TEMP/post-update-paths.txt" >> "$GITHUB_OUTPUT"
          echo "has_paths=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_paths=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Push post-update builds to cache
      if: ${{ always() && steps.post-paths.outputs.has_paths == 'true' && inputs.cache-s3-url != '' && inputs.aws-access-key-id != '' && inputs.aws-secret-access-key != '' }}
      shell: bash
      env:
        STORE_PATHS_FILE: ${{ steps.post-paths.outputs.path-file }}
        CACHE_S3_URL: ${{ inputs.cache-s3-url }}
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
      run: |
        # No signing here: the caller's setup-nix registers the key via nix.conf's
        # secret-key-files, so locally-built paths already carry a signature.
        # `< file` rather than `-a file`: BSD xargs on the macOS runners has no -a.
        xargs < "$STORE_PATHS_FILE" nix copy --to "$CACHE_S3_URL"

    - name: Create or update PR
      if: ${{ steps.check.outputs.has_changes == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch-name }}
        HAS_APP_TOKEN: ${{ inputs.has-app-token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Generate a human-readable summary of changed direct inputs with compare links.
        # At this point HEAD:flake.lock is the old (committed) version and flake.lock
        # in the working tree is the new (updated) version.
        if git show HEAD:flake.lock > "$RUNNER_TEMP/old-flake.lock" 2>/dev/null; then
          input_summary=$("$GITHUB_ACTION_PATH/flake-lock-summary.sh" "$RUNNER_TEMP/old-flake.lock" flake.lock)
        else
          input_summary="(New flake.lock — no previous version to compare.)"
        fi

        {
          if [[ "$HAS_APP_TOKEN" != "true" ]]; then
            printf "> [!WARNING]  \n"
            printf "> This PR was created with \`GITHUB_TOKEN\`. Downstream CI will **not** trigger automatically.\n"
            printf "> To run CI, close and reopen this PR, or push an empty commit to the branch.\n"
            printf "> To avoid this in the future, configure a GitHub App token for this workflow.\n\n"
          fi
          printf $'Automated `nix flake update` run.\n\n'
          if [[ -s "$RUNNER_TEMP/build-failures.txt" ]]; then
            printf "> [!WARNING]  \n"
            printf "> Some diff targets failed to build and are missing from the package diff:\n>\n"
            sed 's/^/> /' "$RUNNER_TEMP/build-failures.txt"
            printf ">\n> See the workflow run logs for the build output.\n\n"
          fi
          printf '### Updated inputs\n\n'
          printf '%s\n\n' "$input_summary"
          if [[ -f "$RUNNER_TEMP/nvd-diff.md" ]]; then
            printf '### Package diff\n\n'
            cat "$RUNNER_TEMP/nvd-diff.md"
            printf '\n'
          fi
        } > "$RUNNER_TEMP/pr-body.md"

        git checkout -B "$BRANCH"
        git add flake.lock
        git commit -m "chore: update flake.lock"
        git push --force origin "$BRANCH"

        existing_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
        if [[ -z "$existing_pr" ]]; then
          if ! pr_output=$(gh pr create \
            --title "chore: update flake.lock" \
            --head "$BRANCH" \
            --body-file "$RUNNER_TEMP/pr-body.md" 2>&1); then
            if [[ "$pr_output" == *"not permitted to create or approve pull requests"* ]]; then
              echo "::error::Cannot create PR with GITHUB_TOKEN. Either enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General, or pass a GitHub App token to this action."
            else
              echo "$pr_output" >&2
            fi
            exit 1
          fi
          echo "PR created."
        else
          gh pr edit "$existing_pr" --body-file "$RUNNER_TEMP/pr-body.md"
          echo "PR #${existing_pr} body updated; the force-push will trigger fresh CI checks."
        fi

    - name: Enable auto-merge
      if: ${{ steps.check.outputs.has_changes == 'true' && inputs.auto-merge == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch-name }}
      run: |
        pr_number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
        if [[ -n "$pr_number" ]]; then
          if gh pr merge "$pr_number" --auto --squash; then
            echo "Auto-merge enabled for PR #${pr_number}."
          else
            echo "::warning::Could not enable auto-merge for PR #${pr_number}. Ensure the repository has 'Allow auto-merge' enabled in settings and branch protection with required status checks configured."
          fi
        fi

    - name: Warn about GITHUB_TOKEN limitations
      if: ${{ steps.check.outputs.has_changes == 'true' && inputs.has-app-token != 'true' }}
      shell: bash
      run: |
        echo "::notice::PR was created with GITHUB_TOKEN. Downstream CI (pull_request events) will not trigger automatically. Close and reopen the PR, or push to the branch manually, to trigger CI. Pass a GitHub App token to this action to avoid this limitation."
