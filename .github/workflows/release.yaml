name: Release

# release-please maintains a release PR from Conventional Commits; merging it tags an exact semver
# release. There is no floating major tag: consumers pin a full version, and Renovate resolves it
# to a commit SHA in their repositories. A moving tag would silently change what a pinned workflow
# runs, which is precisely what pinning is for.
#
# PRs are opened with a GitHub App token when one is configured. A PR created with GITHUB_TOKEN
# does not fire `pull_request` events, so this repository's own Lint workflow never runs on the
# release PR — the token falls back to GITHUB_TOKEN so the workflow still functions, just without
# that check.

on:
  push:
    branches: [main]
  # release-please only compares an open release PR's title and body, so it will not pick up a
  # config change on its own. Closing the PR and dispatching this rebuilds it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # The `secrets` context is not available in a step-level `if:`, so the presence check is
      # hoisted to job level where it is.
      HAS_APP_CREDS: ${{ secrets.CI_APP_ID != '' && secrets.CI_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Generate app token
        id: app-token
        if: ${{ env.HAS_APP_CREDS == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
